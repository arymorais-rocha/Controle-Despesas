<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Despesas</title>
  
  <!-- Bibliotecas para geração do PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .header-title h1 { font-size: 1.8rem; font-weight: 700; }
    .header-sub { font-size: 0.85rem; color: var(--subtext); display: flex; align-items: center; gap: 8px; margin-top: 4px; }

    .sync-indicator { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.1); }
    .sync-ok { color: var(--success); background: rgba(16, 185, 129, 0.15); }
    .sync-loading { color: var(--warning); background: rgba(245, 158, 11, 0.15); }

    .header-controls { display: flex; gap: 10px; align-items: center; }
    select, input[type="text"], input[type="number"], input[type="date"], button { 
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; 
    }
    button { cursor: pointer; background: var(--accent); border: none; font-weight: 600; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--card-bg); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-pdf { background: #10b981; color: #fff; }
    .btn-pdf:hover { background: #059669; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: #ffffff; color: #0f172a; padding: 18px; border-radius: 12px; }
    .card span { font-size: 0.85rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .card h2 { font-size: 1.6rem; margin-top: 5px; }

    .filters-bar { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .filters-bar input[type="text"] { flex: 1; min-width: 200px; }

    .quick-select-group { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); }
    .quick-select-group label { font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .quick-select-group input[type="checkbox"] { cursor: pointer; width: 15px; height: 15px; accent-color: var(--accent); }

    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

    .table-container { background: #ffffff; border-radius: 12px; overflow-x: auto; color: #0f172a; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    tr:hover { background: #f1f5f9; }

    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-vencida { background: #fee2e2; color: #dc2626; }
    .badge-hoje { background: #fef3c7; color: #b45309; }
    .badge-paga { background: #d1fae5; color: #059669; }
    .badge-pendente { background: #e0f2fe; color: #0369a1; }

    @keyframes piscarVermelho {
      0%, 100% { color: #dc2626; opacity: 1; }
      50% { color: #991b1b; opacity: 0.2; }
    }

    @keyframes piscarAmarelo {
      0%, 100% { color: #d97706; opacity: 1; }
      50% { color: #92400e; opacity: 0.2; }
    }

    .fornecedor-vencido { animation: piscarVermelho 1s infinite; font-weight: 700; }
    .fornecedor-hoje { animation: piscarAmarelo 1s infinite; font-weight: 700; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
    .modal.open { display: flex; }
    .modal-content { background: var(--card-bg); border-radius: 12px; width: 100%; max-width: 500px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--subtext); margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <h1>Controle de Despesas</h1>
        <div class="header-sub">
          <span>Sincronizado com o Google Drive</span>
          <span id="syncIndicator" class="sync-indicator sync-ok">✓ Sincronizado</span>
        </div>
      </div>
      <div class="header-controls">
        <button class="btn-secondary" onclick="openControlModal()">⚙️ Gerenciar Controles</button>
        <button onclick="openModal()">+ Nova despesa</button>
      </div>
    </header>

    <div class="cards-grid">
      <div class="card"><span>A vencer</span><h2 id="cardAVencer">R$ 0,00</h2></div>
      <div class="card"><span>Vencidas</span><h2 id="cardVencidas">R$ 0,00</h2></div>
      <div class="card"><span>Vence hoje</span><h2 id="cardVenceHoje">R$ 0,00</h2></div>
      <div class="card"><span>Total das selecionadas</span><h2 id="cardSelecionadas">R$ 0,00</h2></div>
    </div>

    <div class="filters-bar">
      <label style="font-size: 0.85rem; color: var(--subtext);">Controle:</label>
      <select id="selectControleAtual" onchange="mudarControle(this.value)"></select>
      
      <div class="quick-select-group">
        <label style="color: #f87171;">
          <input type="checkbox" id="chkVencidas" onchange="toggleStatusGroup('vencidas', this.checked)"> Vencidas
        </label>
        <label style="color: #60a5fa;">
          <input type="checkbox" id="chkAVencer" onchange="toggleStatusGroup('aVencer', this.checked)"> A Vencer
        </label>
        <label style="color: #34d399;">
          <input type="checkbox" id="chkPagas" onchange="toggleStatusGroup('pagas', this.checked)"> Pagas
        </label>
      </div>

      <input type="text" id="filterBusca" placeholder="Pesquisar fornecedor..." oninput="render()">
      <label style="font-size: 0.85rem; color: var(--subtext);">De:</label>
      <input type="date" id="filterDe" onchange="render()">
      <label style="font-size: 0.85rem; color: var(--subtext);">Até:</label>
      <input type="date" id="filterAte" onchange="render()">
      <button class="btn-secondary" onclick="limparFiltros()">Limpar período</button>
    </div>

    <div class="action-buttons">
      <button class="btn-secondary" onclick="exportCSV()">Exportar CSV</button>
      <button class="btn-pdf" onclick="exportPDFSelecionadas()">📄 PDF das Selecionadas</button>
      <button class="btn-secondary" onclick="marcarTodas(true)">Marcar todas</button>
      <button class="btn-secondary" onclick="marcarTodas(false)">Desmarcar todas</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th width="40"><input type="checkbox" id="checkAll" onchange="toggleSelectAll(this.checked)"></th>
            <th>Fornecedor</th>
            <th>Valor</th>
            <th>Vencimento</th>
            <th>Pagamento</th>
            <th>Situação</th>
            <th>Anexo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Cadastro/Edição -->
  <div class="modal" id="modalDespesa">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Nova Despesa</div>
      <div class="form-group">
        <label>Fornecedor</label>
        <input type="text" id="fFornecedor" placeholder="Ex: Posto Trevo">
      </div>
      <div class="form-group">
        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="fValor" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Data de Vencimento</label>
        <input type="date" id="fVenc">
      </div>
      <div class="form-group">
        <label>Data de Pagamento</label>
        <input type="date" id="fPag">
      </div>
      <div class="form-group">
        <label>Comprovante/Anexo (Imagem ou PDF)</label>
        <input type="file" id="fAnexo" accept="image/*,.pdf">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button onclick="save()" id="btnSalvar">Salvar Despesa</button>
      </div>
    </div>
  </div>

  <!-- Modal Gerenciar Controles -->
  <div class="modal" id="modalControles">
    <div class="modal-content">
      <div class="modal-header">Gerenciar Controles</div>
      <div class="form-group">
        <label>Adicionar Novo Controle</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="novoControleNome" placeholder="Ex: Fazenda Boa Esperança">
          <button onclick="adicionarControle()">Adicionar</button>
        </div>
      </div>
      <div class="form-group">
        <label>Controles Existentes</label>
        <ul id="listaControlesUI" style="list-style: none; padding: 0;"></ul>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeControlModal()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    let appState = {
      controleAtual: "Geral",
      listaControles: ["Geral", "Romerio", "Fazenda Boa Esperança", "Fazenda Alvorada"],
      despesas: []
    };

    let selectedIndexes = new Set();
    let editingIndex = -1;

    function updateSyncIndicator(text, className) {
      const el = document.getElementById('syncIndicator');
      if (el) {
        el.innerText = text;
        el.className = 'sync-indicator ' + (className || '');
      }
    }

    window.onload = function() {
      fetchFromDrive();
    };

    function fetchFromDrive() {
      updateSyncIndicator("☁️ Buscando dados...", "sync-loading");

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(resposta) {
            try {
              if (resposta) {
                let parsed = typeof resposta === 'string' ? JSON.parse(resposta) : resposta;
                if (parsed && parsed.listaControles) {
                  appState = parsed;
                }
              }
              updateSyncIndicator("✓ Sincronizado", "sync-ok");
            } catch(e) {
              updateSyncIndicator("✓ Conectado", "sync-ok");
            }
            renderSelectControles();
            render();
          })
          .withFailureHandler(function() {
            updateSyncIndicator("⚠️ Modo Local", "");
            renderSelectControles();
            render();
          })
          .carregarDados();
      } else {
        updateSyncIndicator("✓ Modo Demo", "sync-ok");
        renderSelectControles();
        render();
      }
    }

    function persist() {
      updateSyncIndicator("☁️ Salvando...", "sync-loading");
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function() {
            updateSyncIndicator("✓ Sincronizado", "sync-ok");
          })
          .salvarDados(JSON.stringify(appState));
      }
    }

    function getCurrentData() {
      return appState.despesas.filter(d => (d.controle || "Geral") === appState.controleAtual);
    }

    function renderSelectControles() {
      const select = document.getElementById('selectControleAtual');
      select.innerHTML = '';
      appState.listaControles.forEach(ctrl => {
        const opt = document.createElement('option');
        opt.value = ctrl;
        opt.innerText = ctrl;
        if (ctrl === appState.controleAtual) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function mudarControle(novoControle) {
      appState.controleAtual = novoControle;
      selectedIndexes.clear();
      resetCheckboxesStatus();
      render();
    }

    function resetCheckboxesStatus() {
      document.getElementById('chkVencidas').checked = false;
      document.getElementById('chkAVencer').checked = false;
      document.getElementById('chkPagas').checked = false;
    }

    function render() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const busca = document.getElementById('filterBusca').value.toLowerCase();
      const de = document.getElementById('filterDe').value;
      const ate = document.getElementById('filterAte').value;
      const mostrarPagas = document.getElementById('chkPagas').checked;

      let aVencer = 0, vencidas = 0, venceHoje = 0, totalSel = 0;
      
      const now = new Date();
      const hoje = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const dados = getCurrentData();

      dados.forEach((item, index) => {
        const estaPaga = !!item.dataPagamento;

        if (estaPaga && !mostrarPagas) return;

        if (busca && !item.fornecedor.toLowerCase().includes(busca)) return;
        if (de && item.vencimento < de) return;
        if (ate && item.vencimento > ate) return;

        const valor = Number(item.valor) || 0;
        
        if (selectedIndexes.has(index)) {
          totalSel += valor;
        }

        let statusClass = "badge-pendente";
        let statusText = "A Vencer";
        let fornecedorClass = "";

        if (estaPaga) {
          statusClass = "badge-paga";
          statusText = "Paga";
        } else if (item.vencimento < hoje) {
          statusClass = "badge-vencida";
          statusText = "Vencida";
          fornecedorClass = "fornecedor-vencido";
          vencidas += valor;
        } else if (item.vencimento === hoje) {
          statusClass = "badge-hoje";
          statusText = "Vence Hoje";
          fornecedorClass = "fornecedor-hoje";
          venceHoje += valor;
          aVencer += valor;
        } else {
          aVencer += valor;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" ${selectedIndexes.has(index) ? 'checked' : ''} onchange="toggleSelect(${index})"></td>
          <td><span class="${fornecedorClass}">${item.fornecedor}</span></td>
          <td>R$ ${valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
          <td>${formatDate(item.vencimento)}</td>
          <td>${item.dataPagamento ? formatDate(item.dataPagamento) : '-'}</td>
          <td><span class="badge ${statusClass}">${statusText}</span></td>
          <td>${item.anexo ? `<a href="${item.anexo}" target="_blank" style="color:var(--accent);">📄 Ver</a>` : '-'}</td>
          <td>
            <button class="btn-secondary" style="padding:4px 8px;" onclick="editItem(${index})">✏️</button>
            <button class="btn-secondary" style="padding:4px 8px; color:var(--danger);" onclick="deleteItem(${index})">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('cardAVencer').innerText = `R$ ${aVencer.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
      document.getElementById('cardVencidas').innerText = `R$ ${vencidas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
      document.getElementById('cardVenceHoje').innerText = `R$ ${venceHoje.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
      document.getElementById('cardSelecionadas').innerText = `R$ ${totalSel.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    }

    function toggleStatusGroup(tipoStatus, isChecked) {
      const now = new Date();
      const hoje = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const dados = getCurrentData();

      dados.forEach((item, index) => {
        const estaPaga = !!item.dataPagamento;
        const estaVencida = !estaPaga && item.vencimento < hoje;
        const estaAVencer = !estaPaga && item.vencimento >= hoje;

        let atendeGrupo = false;
        if (tipoStatus === 'vencidas' && estaVencida) atendeGrupo = true;
        if (tipoStatus === 'aVencer' && estaAVencer) atendeGrupo = true;
        if (tipoStatus === 'pagas' && estaPaga) atendeGrupo = true;

        if (atendeGrupo) {
          if (isChecked) {
            selectedIndexes.add(index);
          } else {
            selectedIndexes.delete(index);
          }
        }
      });

      render();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function openModal() {
      editingIndex = -1;
      document.getElementById('modalTitle').innerText = "Nova Despesa";
      document.getElementById('fFornecedor').value = '';
      document.getElementById('fValor').value = '';
      document.getElementById('fVenc').value = '';
      document.getElementById('fPag').value = '';
      document.getElementById('fAnexo').value = '';
      document.getElementById('modalDespesa').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalDespesa').classList.remove('open');
    }

    // Função de auxílio para ler arquivo em Base64
    function lerArquivoBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function save() {
      const fF = document.getElementById('fFornecedor').value.trim();
      const fV = Number(document.getElementById('fValor').value || 0);
      const fVc = document.getElementById('fVenc').value;
      const fP = document.getElementById('fPag').value || '';
      const inputAnexo = document.getElementById('fAnexo');

      if (!fF || !fVc) {
        alert('Preencha pelo menos o fornecedor e a data de vencimento.');
        return;
      }

      let urlAnexo = null;
      let nomeAnexo = null;

      // Mantém o anexo antigo se estiver apenas editando
      if (editingIndex >= 0) {
        const itemExistente = getCurrentData()[editingIndex];
        urlAnexo = itemExistente.anexo || null;
        nomeAnexo = itemExistente.anexoNome || null;
      }

      const btnSalvar = document.getElementById('btnSalvar');
      btnSalvar.disabled = true;
      btnSalvar.innerText = "Salvando...";

      if (inputAnexo && inputAnexo.files && inputAnexo.files[0]) {
        updateSyncIndicator("☁️ Enviando anexo...", "sync-loading");
        const file = inputAnexo.files[0];
        nomeAnexo = file.name;

        try {
          const dataUrl = await lerArquivoBase64(file);
          // Remove a informação do Data URI e obtém apenas o conteúdo Base64
          const base64Data = dataUrl.split(',')[1];
          const mimeType = file.type;

          if (typeof google !== 'undefined' && google.script && google.script.run) {
            const uploadRes = await new Promise((resolve) => {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler((err) => {
                  console.error(err);
                  resolve(null);
                })
                .salvarArquivoNoDrive({ base64: base64Data, nome: nomeAnexo, mimeType: mimeType });
            });

            if (uploadRes && uploadRes.status === "OK") {
              urlAnexo = uploadRes.url;
            } else {
              alert("Aviso: Não foi possível enviar o anexo. O item será salvo sem arquivo.");
            }
          }
        } catch (e) {
          console.error("Erro na leitura do arquivo", e);
        }
      }

      const novaDespesa = {
        controle: appState.controleAtual,
        fornecedor: fF,
        valor: fV,
        vencimento: fVc,
        dataPagamento: fP,
        anexo: urlAnexo,
        anexoNome: nomeAnexo
      };

      if (editingIndex >= 0) {
        let count = 0;
        for (let i = 0; i < appState.despesas.length; i++) {
          if ((appState.despesas[i].controle || "Geral") === appState.controleAtual) {
            if (count === editingIndex) {
              appState.despesas[i] = novaDespesa;
              break;
            }
            count++;
          }
        }
      } else {
        appState.despesas.push(novaDespesa);
      }

      persist();
      btnSalvar.disabled = false;
      btnSalvar.innerText = "Salvar Despesa";
      closeModal();
      render();
    }

    function editItem(index) {
      editingIndex = index;
      const item = getCurrentData()[index];
      document.getElementById('modalTitle').innerText = "Editar Despesa";
      document.getElementById('fFornecedor').value = item.fornecedor;
      document.getElementById('fValor').value = item.valor;
      document.getElementById('fVenc').value = item.vencimento;
      document.getElementById('fPag').value = item.dataPagamento || '';
      document.getElementById('fAnexo').value = '';
      document.getElementById('modalDespesa').classList.add('open');
    }

    function deleteItem(index) {
      if (!confirm('Deseja realmente excluir esta despesa?')) return;
      let count = 0;
      for (let i = 0; i < appState.despesas.length; i++) {
        if ((appState.despesas[i].controle || "Geral") === appState.controleAtual) {
          if (count === index) {
            appState.despesas.splice(i, 1);
            break;
          }
          count++;
        }
      }
      persist();
      render();
    }

    function toggleSelect(index) {
      if (selectedIndexes.has(index)) selectedIndexes.delete(index);
      else selectedIndexes.add(index);
      render();
    }

    function toggleSelectAll(checked) {
      selectedIndexes.clear();
      if (checked) {
        const mostrarPagas = document.getElementById('chkPagas').checked;
        getCurrentData().forEach((item, i) => {
          if (!item.dataPagamento || mostrarPagas) {
            selectedIndexes.add(i);
          }
        });
      }
      render();
    }

    function marcarTodas(status) {
      toggleSelectAll(status);
      document.getElementById('checkAll').checked = status;
    }

    function limparFiltros() {
      document.getElementById('filterBusca').value = '';
      document.getElementById('filterDe').value = '';
      document.getElementById('filterAte').value = '';
      resetCheckboxesStatus();
      render();
    }

    function openControlModal() {
      renderListaControlesModal();
      document.getElementById('modalControles').classList.add('open');
    }

    function closeControlModal() {
      document.getElementById('modalControles').classList.remove('open');
    }

    function renderListaControlesModal() {
      const ul = document.getElementById('listaControlesUI');
      ul.innerHTML = '';
      appState.listaControles.forEach((ctrl, idx) => {
        const li = document.createElement('li');
        li.style.display = 'flex';
        li.style.justifyContent = 'space-between';
        li.style.alignItems = 'center';
        li.style.padding = '8px 0';
        li.style.borderBottom = '1px solid var(--border)';
        li.innerHTML = `
          <span>${ctrl}</span>
          ${idx > 0 ? `<button class="btn-secondary" style="color:var(--danger); padding:2px 6px;" onclick="removerControle('${ctrl}')">Excluir</button>` : '<small>Padrão</small>'}
        `;
        ul.appendChild(li);
      });
    }

    function adicionarControle() {
      const nome = document.getElementById('novoControleNome').value.trim();
      if (!nome) return;
      if (!appState.listaControles.includes(nome)) {
        appState.listaControles.push(nome);
        document.getElementById('novoControleNome').value = '';
        persist();
        renderSelectControles();
        renderListaControlesModal();
      }
    }

    function removerControle(nome) {
      if (!confirm(`Excluir o controle "${nome}"?`)) return;
      appState.listaControles = appState.listaControles.filter(c => c !== nome);
      if (appState.controleAtual === nome) appState.controleAtual = "Geral";
      persist();
      renderSelectControles();
      renderListaControlesModal();
      render();
    }

    function exportCSV() {
      const dados = getCurrentData();
      let csv = 'Fornecedor;Valor;Vencimento;Pagamento\n';
      dados.forEach(d => {
        csv += `"${d.fornecedor}";"${d.valor}";"${d.vencimento}";"${d.dataPagamento || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Despesas_${appState.controleAtual}.csv`;
      link.click();
    }

    function exportPDFSelecionadas() {
      if (selectedIndexes.size === 0) {
        alert("Por favor, selecione pelo menos uma despesa para gerar o PDF.");
        return;
      }

      const dados = getCurrentData();
      const selecionadas = [];
      let totalSelecionadas = 0;

      dados.forEach((item, index) => {
        if (selectedIndexes.has(index)) {
          selecionadas.push(item);
          totalSelecionadas += Number(item.valor) || 0;
        }
      });

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const hoje = new Date();
      const dataGeracaoStr = hoje.toLocaleDateString('pt-BR');

      doc.setFontSize(16);
      doc.text(`Relatório de Despesas Selecionadas - ${appState.controleAtual}`, 14, 15);
      
      doc.setFontSize(10);
      doc.text(`Data de Geração: ${dataGeracaoStr}`, 14, 22);

      const tableRows = selecionadas.map(d => [
        d.fornecedor,
        `R$ ${(Number(d.valor) || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`,
        formatDate(d.vencimento),
        d.dataPagamento ? formatDate(d.dataPagamento) : '-'
      ]);

      doc.autoTable({
        startY: 28,
        head: [['Fornecedor', 'Valor', 'Vencimento', 'Data Pagamento']],
        body: tableRows,
        theme: 'striped',
        headStyles: { fillColor: [30, 41, 59] }
      });

      const finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.text(`Total das Selecionadas: R$ ${totalSelecionadas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`, 14, finalY);

      doc.save(`Despesas_Selecionadas_${appState.controleAtual}_${dataGeracaoStr.replace(/\//g, '-')}.pdf`);
    }
  </script>
</body>
</html>
